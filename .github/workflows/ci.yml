name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v9 of the action for golangci-lint v2, which .golangci.yml is
      # written against (`version: "2"`). The v6 action installs the latest
      # v1 instead — 1.64.8, built with Go 1.24, which refuses a go.mod
      # targeting 1.25 outright. Pinned rather than `latest` so a linter
      # release cannot fail CI on a commit that did not change.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash on every leg of the matrix, so both run the identical command.
    # The default shell on a Windows runner is PowerShell, which delivered
    # `-coverprofile=cover.out` to go as two arguments — `-coverprofile=cover`
    # and `.out`, which go then tried to resolve as a package and failed on
    # ("no required module provides package .out") while every real test
    # passed. bash ships on all the hosted runners.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test -race -coverprofile=cover.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: cover.out

  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The platforms releases are built for. macOS is not among them:
      # ReShade injects into Windows games, which macOS does not run.
      - run: GOOS=linux GOARCH=arm64 go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./...
