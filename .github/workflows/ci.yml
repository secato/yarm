name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v9 of the action for golangci-lint v2, which .golangci.yml is
      # written against (`version: "2"`). The v6 action installs the latest
      # v1 instead — 1.64.8, built with Go 1.24, which refuses a go.mod
      # targeting 1.25 outright. Pinned rather than `latest` so a linter
      # release cannot fail CI on a commit that did not change.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test -race -coverprofile=cover.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The architectures releases are built for.
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
