name: Release

# Only a pushed `v*` tag releases anything. Nothing here runs on a branch
# push, so a merge to main cannot publish a release by accident.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload archives

jobs:
  # The release binaries are built from the tag, so the tag has to be green
  # on its own rather than trusting that the branch it points at was.
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test -race ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the commits since the last
          # tag, which a shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passwordless AUR deploy key; see CONTRIBUTING.md. Unused while
          # the aurs step has skip_upload: true.
          AUR_KEY: ${{ secrets.AUR_KEY }}
